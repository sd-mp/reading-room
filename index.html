<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181f;
    --ink-soft:#1c222c;
    --paper:#ece7dd;
    --paper-dim:#a9a496;
    --brass:#c8a24b;
    --line:#2b3340;
    --ok:#8fae7d;
    --meh:#8a8477;
  }
  body.light{
    --ink:#f5f0e8;
    --ink-soft:#ede8df;
    --paper:#2c2820;
    --paper-dim:#7a7368;
    --brass:#8c6b1f;
    --line:#d6d0c6;
    --ok:#4a7a38;
    --meh:#7a7368;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:-webkit-fill-available}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:"Newsreader",Georgia,serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    height:100dvh;min-height:-webkit-fill-available;max-height:100dvh;overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .mono{font-family:"IBM Plex Mono",monospace}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

  /* top bar */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px 10px;
  }
  .brand{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-dim)}
  .stat-btn{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.1em;color:var(--paper-dim);padding:6px 8px}
  .stat-btn:hover{color:var(--paper)}

  /* focus line */
  .focus-wrap{padding:0 20px}
  .focus-label{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--paper-dim);display:flex;justify-content:space-between;margin-bottom:8px}
  .focus-track{height:2px;background:var(--line);position:relative;overflow:hidden}
  .focus-fill{height:100%;width:0%;background:var(--brass);transition:width .25s linear}

  /* card */
  main{flex:1 1 auto;min-height:0;overflow:hidden;padding:0;display:flex;flex-direction:column}
  .slides-track{flex:1 1 auto;min-height:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .slides-track::-webkit-scrollbar{display:none}
  .slides-inner{display:flex;flex-direction:row;height:100%}
  .slide{width:100vw;height:100%;flex-shrink:0;scroll-snap-align:start;padding:18px 22px 20px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;box-sizing:border-box}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:18px}
  .title{font-size:clamp(26px,6vw,38px);line-height:1.12;font-weight:500;letter-spacing:-.01em;margin-bottom:20px}
  .excerpt{font-size:clamp(17px,4.4vw,20px);line-height:1.62;color:var(--paper);max-width:38em;opacity:.88}
  .excerpt p{margin-bottom:14px}
  .readmore{display:inline-block;margin-top:22px;font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.06em;color:var(--paper);border-bottom:1px solid var(--brass);padding-bottom:2px}
  .slide-hint{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;color:var(--paper-dim);margin-top:auto;padding-top:12px;text-align:right}

  /* footer controls */
  footer{padding:14px 20px calc(18px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;border-top:1px solid var(--line)}
  .next{
    flex:1;background:var(--ink-soft);color:var(--paper);
    font-family:"IBM Plex Mono",monospace;font-size:14px;letter-spacing:.08em;
    padding:16px;border:1px solid var(--line);border-radius:2px;
    transition:opacity .3s,background .2s;
  }
  .next:enabled:hover{background:var(--line)}
  .next:disabled{opacity:.4;cursor:not-allowed}
  .done{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.1em;color:var(--paper-dim);padding:16px 6px}
  .done:hover{color:var(--paper)}

  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(10,13,18,.9);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:26px;z-index:20}
  .overlay.show{display:flex}
  .panel{background:var(--ink-soft);border:1px solid var(--line);border-radius:3px;max-width:420px;width:100%;padding:28px}
  .panel h2{font-size:24px;font-weight:500;margin-bottom:6px}
  .panel p{color:var(--paper-dim);font-size:15px;line-height:1.5;margin-bottom:22px}
  .verdict-row{display:flex;gap:12px}
  .verdict{flex:1;padding:15px;border-radius:2px;font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.06em;border:1px solid var(--line)}
  .verdict.worth{background:rgba(143,174,125,.12);border-color:var(--ok);color:#c3d6b3}
  .verdict.meh{background:rgba(138,132,119,.1);color:var(--paper-dim)}

  /* stats panel */
  .stats-list{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
  .stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:13px}
  .stat-row .k{color:var(--paper-dim);letter-spacing:.04em}
  .stat-row .v{font-size:20px;color:var(--paper)}
  .stat-row .v small{font-size:12px;color:var(--paper-dim)}
  .panel-actions{display:flex;gap:12px;flex-wrap:wrap}
  .ghost{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;color:var(--paper);border:1px solid var(--line);border-radius:2px;padding:12px 14px}
  .ghost:hover{background:var(--line)}
  .ghost.danger:hover{border-color:#a5584e;color:#e0a89f}
  .close-x{position:absolute;top:16px;right:18px;font-family:"IBM Plex Mono",monospace;font-size:18px;color:var(--paper-dim)}

  .loading{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.08em;color:var(--paper-dim);text-align:center;padding:40px}

  /* category picker */
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
  .cat-btn{padding:14px 12px;border:1px solid var(--line);border-radius:2px;text-align:left;background:none;color:var(--paper);cursor:pointer;transition:border-color .15s,background .15s}
  .cat-btn .cat-label{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:5px}
  .cat-btn .cat-desc{font-size:12px;color:var(--paper-dim);line-height:1.4;font-family:"IBM Plex Mono",monospace}
  .cat-btn.on{border-color:var(--brass);background:rgba(200,162,75,.08)}
  .cat-btn.on .cat-label{color:var(--brass)}
  .start-btn{width:100%;padding:16px;background:var(--brass);color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-radius:2px;border:none;cursor:pointer;font-weight:500}
  .start-btn:disabled{opacity:.35;cursor:not-allowed}
</style>
</head>
<body>
  <header>
    <span class="brand">Reading Room</span>
    <div style="display:flex;gap:4px;align-items:center">
      <button class="stat-btn" id="prefsBtn">⚙</button>
      <button class="stat-btn" id="themeBtn">light</button>
      <button class="stat-btn" id="statsBtn">scorecard</button>
    </div>
  </header>

  <div class="focus-wrap">
    <div class="focus-label mono"><span id="focusState">focus</span><span id="focusCount"></span></div>
    <div class="focus-track"><div class="focus-fill" id="focusFill"></div></div>
  </div>

  <main>
    <div class="slides-track" id="card">
      <div class="slide"><div class="loading" id="loading">gathering a few things worth your attention…</div></div>
    </div>
  </main>

  <footer>
    <button class="next" id="nextBtn" disabled>hold…</button>
    <button class="done" id="doneBtn">I'm done</button>
  </footer>

  <!-- worth-it overlay -->
  <div class="overlay" id="verdictOverlay">
    <div class="panel" style="position:relative">
      <button class="close-x" id="closeVerdict">×</button>
      <h2>Was this worth it?</h2>
      <p>One honest tap. This is the whole point of the test — did you get something you actually wanted?</p>
      <div class="verdict-row">
        <button class="verdict worth" data-v="worth">Worth it</button>
        <button class="verdict meh" data-v="meh">Meh</button>
      </div>
    </div>
  </div>

  <!-- category picker overlay -->
  <div class="overlay" id="pickerOverlay">
    <div class="panel" style="position:relative;max-height:88vh;overflow-y:auto">
      <button class="close-x" id="closePicker">×</button>
      <h2>What do you want to read?</h2>
      <p>Tap to select your interests. Pick at least one.</p>
      <div class="cat-grid" id="catGrid"></div>
      <button class="start-btn" id="startBtn">Start reading</button>
    </div>
  </div>

  <!-- stats overlay -->
  <div class="overlay" id="statsOverlay">
    <div class="panel" style="position:relative">
      <button class="close-x" id="closeStats">×</button>
      <h2 style="margin-bottom:18px">10-day scorecard</h2>
      <div class="stats-list" id="statsList"></div>
      <div class="panel-actions">
        <button class="ghost" id="exportBtn">Export CSV</button>
        <button class="ghost danger" id="resetBtn">Reset all data</button>
      </div>
    </div>
  </div>

<script>
if("scrollRestoration" in history){ history.scrollRestoration = "manual"; }
/* ============================================================
   SOURCES
   • Current news  → The Guardian API (returns full article text)
   • Knowledge     → Wikipedia article extracts
   • Ideas         → full-text essay feeds
   ============================================================ */
// Guardian free key. "test" works for light personal use straight away.
// If news stops loading, get your own free key (2 min, no card) at
// https://open-platform.theguardian.com/access/ and paste it below.
const GUARDIAN_KEY = "test";

// How many Wikipedia knowledge cards to pull per load.
const WIKI_COUNT = 8;

const CATEGORIES = [
  { id: "news",       label: "News",           desc: "Current affairs & investigative journalism" },
  { id: "sport",      label: "Sport",          desc: "Sports news and analysis" },
  { id: "technology", label: "Technology",     desc: "Tech industry and innovation" },
  { id: "business",   label: "Business",       desc: "Business, economics & strategy" },
  { id: "ideas",      label: "Ideas & Essays", desc: "Long-form thinking and culture" },
  { id: "knowledge",  label: "Knowledge",      desc: "Science, history & academic writing" },
];

const ESSAY_FEEDS = [
  { name: "The Marginalian",    url: "https://www.themarginalian.org/feed/",              category: "ideas" },
  { name: "Astral Codex Ten",   url: "https://astralcodexten.substack.com/feed",          category: "ideas" },
  { name: "Overcoming Bias",    url: "https://www.overcomingbias.com/feed",               category: "ideas" },
];

const NEWS_FEEDS = [
  { name: "Ars Technica",             url: "https://feeds.arstechnica.com/arstechnica/index",     category: "technology" },
  { name: "The Conversation",         url: "https://theconversation.com/us/articles.atom",         category: "knowledge" },
  { name: "ProPublica",               url: "https://www.propublica.org/feeds/propublica/main",     category: "knowledge" },
  { name: "MIT Technology Review",    url: "https://www.technologyreview.com/feed/",               category: "technology" },
  { name: "Fast Company",             url: "https://www.fastcompany.com/rss",                      category: "business" },
  { name: "Letters from an American", url: "https://heathercoxrichardson.substack.com/feed",       category: "news" },
  { name: "Platformer",               url: "https://www.platformer.news/feed",                     category: "technology" },
  { name: "Popular Information",      url: "https://popular.info/feed",                            category: "news" },
  { name: "No Mercy No Malice",       url: "https://www.profgalloway.com/feed",                    category: "business" },
];

/* The lock adapts to how long the card actually takes to read.
   It's derived from the word count shown, clamped between a floor and a ceiling —
   so you can't skip before you've had time to read, but you're never left waiting. */
const READ_WPM     = 200;   // assumed reading speed (words per minute)
const MIN_SECONDS  = 15;    // floor: enough to stop reflexive skipping on short items
const MAX_SECONDS  = 90;    // ceiling: never force a longer dwell than this
/* ============================================================ */

// ---- tiny storage shim: real persistence when hosted; in-memory fallback in sandboxed previews ----
const store = (() => {
  let ok = true;
  try { const k="__t"; localStorage.setItem(k,"1"); localStorage.removeItem(k); }
  catch(e){ ok = false; }
  const mem = {};
  return {
    get(k){ try{ return ok ? localStorage.getItem(k) : (mem[k]??null); }catch(e){ return mem[k]??null; } },
    set(k,v){ try{ ok ? localStorage.setItem(k,v) : (mem[k]=v); }catch(e){ mem[k]=v; } }
  };
})();

const LOG_KEY   = "rr_sessions_v1";
const PREFS_KEY = "rr_categories";
function loadLog(){ try{ return JSON.parse(store.get(LOG_KEY)||"[]"); }catch(e){ return []; } }
function saveLog(l){ store.set(LOG_KEY, JSON.stringify(l)); }
function loadPrefs(){ try{ const p=store.get(PREFS_KEY); return p ? JSON.parse(p) : null; }catch(e){ return null; } }
function savePrefs(cats){ store.set(PREFS_KEY, JSON.stringify(cats)); }
function enabledSet(){ return new Set(loadPrefs() || CATEGORIES.map(c=>c.id)); }

// ---- fallback cards so the screen is never dead (e.g. in a preview that blocks network) ----
const FALLBACK = [
  { source:"Reading Room", category:"news", title:"This is a sample card", excerpt:"If you're seeing sample cards, live articles couldn't load here — that's normal inside a preview. Once you host the file (see the chat), your real feeds appear. The mechanic below is exactly what you're testing: the line at the top must fill before you can move on.", link:"#" },
  { source:"Reading Room", category:"news", title:"Sit with one thing", excerpt:"The whole experiment is whether you'll stay past the point you're allowed to leave. Don't rush to the next card. Notice if you *want* to keep going, or if you're just filling time.", link:"#" },
  { source:"Reading Room", category:"news", title:"Grade honestly on day 10", excerpt:"Tap 'scorecard' any time. The number that matters most is voluntary minutes — time you spent beyond what the timer forced. That's the signal that this is a real want, not a manufactured one.", link:"#" },
];

let allItems    = [];              // every fetched item, unfiltered — used to rebuild buckets when prefs change
let buckets     = new Map();      // category -> array of items
let served      = [];             // items shown, for recycling when all run out
let rrOrder     = [];             // category keys in round-robin order
let rrPtr       = 0;
let lastGroup   = null;
let currentItem = null;
let session     = null;
let cardEnteredAt = 0;
let focusTimer  = null;
let currentForced = MIN_SECONDS;
let pickerOpen  = false;          // true while the category picker is showing

// ---- feed fetching: try a purpose-built RSS service first, then two CORS proxies, all with a timeout ----
async function fetchWithTimeout(url, ms=7000){
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, { signal: ctrl.signal }); }
  finally { clearTimeout(id); }
}

function cleanExcerpt(raw){
  const tmp = document.createElement("div");
  tmp.innerHTML = (raw || "").replace(/<\/?(p|br|li|h[1-6])[^>]*>/gi, "\n");
  let t = (tmp.textContent || "").replace(/\n{3,}/g,"\n\n").replace(/[ \t]+/g," ").trim();
  if(t.length > 2600){
    t = t.slice(0,2600);
    const m = t.match(/^([\s\S]*[.!?])[^.!?]*$/);
    t = m ? m[1] : t.replace(/\s\S*$/,"") + "…";
  }
  return t;
}

// forced dwell for a card, based on the actual words shown (never longer than the text)
function forcedSecondsFor(text){
  const words = (text.match(/\S+/g) || []).length;
  const est = Math.round((words / READ_WPM) * 60);
  return Math.min(MAX_SECONDS, Math.max(MIN_SECONDS, est));
}

function pickLonger(a, b){ a = a || ""; b = b || ""; return a.length >= b.length ? a : b; }

// ---- RSS engine (essay feeds): rss2json first, then two CORS proxies ----
async function viaRss2json(feed){
  const u = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feed.url);
  const r = await fetchWithTimeout(u);
  const d = await r.json();
  if(d.status !== "ok" || !Array.isArray(d.items)) throw new Error("rss2json");
  return d.items.slice(0,12).map(it => ({
    source: feed.name,
    title: (it.title || "").trim(),
    excerpt: cleanExcerpt(pickLonger(it.content, it.description)),
    link: it.link || "#",
    category: feed.category,
  })).filter(x => x.title && x.excerpt);
}

async function viaProxyXML(feed, proxyUrl, isAllOrigins){
  const r = await fetchWithTimeout(proxyUrl);
  const text = isAllOrigins ? (await r.json()).contents : await r.text();
  const xml = new DOMParser().parseFromString(text, "text/xml");
  const nodes = [...xml.querySelectorAll("item"), ...xml.querySelectorAll("entry")];
  return nodes.slice(0,12).map(n => {
    const get = t => (n.querySelector(t)?.textContent || "").trim();
    let link = get("link");
    if(!link){ const l = n.querySelector("link"); link = l?.getAttribute("href") || "#"; }
    const bodies = ["description","summary","content"].map(get);
    const enc = n.getElementsByTagName("content:encoded")[0];
    if(enc) bodies.push((enc.textContent || "").trim());
    const body = bodies.sort((a,b) => b.length - a.length)[0] || "";
    return { source: feed.name, title: get("title"), excerpt: cleanExcerpt(body), link, category: feed.category };
  }).filter(x => x.title && x.excerpt);
}

async function fetchRSS(feed){
  const enc = encodeURIComponent(feed.url);
  const attempts = [
    () => viaRss2json(feed),
    () => viaProxyXML(feed, "https://corsproxy.io/?url=" + enc, false),
    () => viaProxyXML(feed, "https://api.allorigins.win/get?url=" + enc, true),
  ];
  for(const attempt of attempts){
    try { const items = await attempt(); if(items.length) return items; }
    catch(e){ /* next method */ }
  }
  return [];
}

// ---- News: Guardian content API (full body text), routed through a CORS proxy ----
async function fetchGuardian(section = null, category = "news"){
  const endpoint = section ? section : "search";
  const api = "https://content.guardianapis.com/" + endpoint
    + "?order-by=newest&page-size=20&show-fields=body"
    + "&api-key=" + encodeURIComponent(GUARDIAN_KEY);
  const proxied = "https://corsproxy.io/?url=" + encodeURIComponent(api);
  const r = await fetchWithTimeout(proxied, 8000);
  const d = await r.json();
  const results = (d && d.response && d.response.results) || [];
  return results.map(a => ({
    source: "Guardian · " + (a.sectionName || "News"),
    title: (a.webTitle || "").trim(),
    excerpt: cleanExcerpt((a.fields && a.fields.body) || ""),
    link: a.webUrl || "#",
    category,
  })).filter(x => x.title && x.excerpt);
}

// ---- Knowledge: Wikipedia random article extracts (CORS-enabled, no key) ----
async function fetchWikipedia(n){
  const one = async () => {
    const r = await fetchWithTimeout("https://en.wikipedia.org/api/rest_v1/page/random/summary", 7000);
    const d = await r.json();
    if(!d.extract) throw new Error("wiki");
    return {
      source: "Wikipedia",
      title: (d.title || "").trim(),
      excerpt: cleanExcerpt(d.extract),
      link: (d.content_urls && d.content_urls.desktop && d.content_urls.desktop.page) || "#",
      category: "knowledge",
    };
  };
  const settled = await Promise.allSettled(Array.from({length:n}, one));
  return settled.filter(s => s.status === "fulfilled").map(s => s.value)
                .filter(x => x.title && x.excerpt && x.excerpt.split(/\s+/).length >= 25);
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function groupOf(item){ return item.category || "other"; }

function populateBuckets(items){
  const enabled = enabledSet();
  for(const it of items){
    if(!enabled.has(it.category)) continue;
    const g = groupOf(it);
    if(!buckets.has(g)){ buckets.set(g, []); if(!rrOrder.includes(g)) rrOrder.push(g); }
    buckets.get(g).push(it);
  }
  for(const arr of buckets.values()) shuffle(arr);
}

function addItems(items){
  allItems.push(...items);
  if(pickerOpen) return;   // accumulate only; buckets populated on picker confirm
  populateBuckets(items);
}

function applyPrefs(){
  buckets = new Map(); rrOrder = []; rrPtr = 0; lastGroup = null; served = [];
  populateBuckets(allItems);
}

// pick the next card, rotating across groups and never repeating a group back-to-back
function pickNext(){
  const anyLeft = () => rrOrder.some(g => (buckets.get(g) || []).length);
  if(!anyLeft()){                        // read everything → recycle what's been served
    if(!served.length) return null;
    const recycle = served; served = [];
    addItems(recycle);
    if(!anyLeft()) return null;
  }
  let chosen = null;
  for(let step = 0; step < rrOrder.length; step++){
    rrPtr = (rrPtr + 1) % rrOrder.length;
    const g = rrOrder[rrPtr];
    const bucket = buckets.get(g) || [];
    if(bucket.length && (g !== lastGroup || countNonEmptyGroups() === 1)){ chosen = g; break; }
  }
  if(!chosen) chosen = rrOrder.find(g => (buckets.get(g) || []).length);  // fallback: any non-empty
  const item = buckets.get(chosen).shift();
  lastGroup = chosen;
  if(item) served.push(item);
  return item;
}
function countNonEmptyGroups(){ return rrOrder.filter(g => (buckets.get(g) || []).length).length; }

let firstRendered = false;
async function loadFeedsProgressive(){
  const sources = [
    fetchGuardian(null,         "news"),
    fetchGuardian("sport",      "sport"),
    fetchGuardian("technology", "technology"),
    fetchGuardian("business",   "business"),
    fetchWikipedia(WIKI_COUNT),
    ...ESSAY_FEEDS.map(f => fetchRSS(f)),
    ...NEWS_FEEDS.map(f => fetchRSS(f)),
  ];
  const tasks = sources.map((p, i) => p.then(items => {
    console.log("[RR] source", i, "loaded", items?.length ?? 0, "items");
    if(items && items.length){
      addItems(items);                         // drop into per-source buckets
      if(!firstRendered){
        firstRendered = true;
        document.getElementById("loading")?.remove();
        renderCard();                          // show the first card the moment anything lands
      }
    }
  }).catch(e => { console.warn("[RR] source", i, "failed:", e?.message); }));
  await Promise.allSettled(tasks);
  if(!firstRendered){                          // everything failed → show the built-in samples
    addItems(FALLBACK.slice());
    firstRendered = true;
    document.getElementById("loading")?.remove();
    renderCard();
  }
}

// ---- session lifecycle ----
function startSession(){
  session = { start: Date.now(), cards: [], forcedTotal: 0 };
}
function endSession(verdict){
  if(!session) return;
  const now = Date.now();
  logCurrentCard(now);
  const log = loadLog();
  const durationSec = Math.round((now - session.start)/1000);
  const forcedSec = session.forcedTotal;
  log.push({
    startISO: new Date(session.start).toISOString(),
    day: new Date(session.start).toISOString().slice(0,10),
    cards: session.cards.length,
    durationSec,
    forcedSec,
    voluntarySec: Math.max(0, durationSec - forcedSec),
    verdict
  });
  saveLog(log);
  session = null;
}
function logCurrentCard(now){
  if(!session || !cardEnteredAt) return;
  const spent = Math.round((now - cardEnteredAt)/1000);
  session.cards.push(spent);
  session.forcedTotal += currentForced;
  cardEnteredAt = 0;
}

function chunkExcerpt(text, wordsPerChunk){
  const paras = text.split(/\n\n+/).filter(Boolean);
  const chunks = []; let cur = []; let count = 0;
  for(const p of paras){
    const w = p.trim().split(/\s+/).length;
    if(count + w > wordsPerChunk && cur.length){ chunks.push(cur.join("\n\n").trim()); cur=[p]; count=w; }
    else{ cur.push(p); count+=w; }
  }
  if(cur.length) chunks.push(cur.join("\n\n").trim());
  return chunks.filter(Boolean);
}

// ---- rendering ----
function renderCard(){
  const item = pickNext();
  if(!item) return;                 // nothing to show (shouldn't happen once loaded)
  currentItem = item;
  const el = document.getElementById("card");
  const chunks = chunkExcerpt(item.excerpt, 120);
  const total = chunks.length;
  el.innerHTML = `<div class="slides-inner">` + chunks.map((chunk, i) => `
    <div class="slide">
      ${i===0 ? `<div class="eyebrow mono">${item.source}</div><h1 class="title">${escapeHtml(item.title)}</h1>` : ""}
      <div class="excerpt">${chunk.split(/\n\n+/).map(p=>`<p>${escapeHtml(p.trim())}</p>`).join("")}</div>
      ${i===total-1 && item.link && item.link!=="#" ? `<a class="readmore" href="${item.link}" target="_blank" rel="noopener">Read the full piece ↗</a>` : ""}
      ${total>1 ? `<div class="slide-hint">${i+1} / ${total}</div>` : ""}
    </div>
  `).join("") + `</div>`;
  el.scrollLeft = 0;
  cardEnteredAt = Date.now();
  currentForced = forcedSecondsFor(item.excerpt);   // dwell scaled to this card's length
  startFocusLock(currentForced);
}

function startFocusLock(seconds){
  const fill = document.getElementById("focusFill");
  const btn = document.getElementById("nextBtn");
  const state = document.getElementById("focusState");
  const count = document.getElementById("focusCount");
  clearInterval(focusTimer);
  btn.disabled = true; btn.textContent = "hold…";
  state.textContent = "focus";
  let elapsed = 0;
  fill.style.width = "0%";
  focusTimer = setInterval(() => {
    elapsed += 0.1;
    const pct = Math.min(100, (elapsed/seconds)*100);
    fill.style.width = pct + "%";
    const remain = Math.ceil(seconds - elapsed);
    count.textContent = remain > 0 ? remain + "s" : "";
    if(elapsed >= seconds){
      clearInterval(focusTimer);
      btn.disabled = false; btn.textContent = "Next →";
      state.textContent = "open — or stay";
      count.textContent = "";
    }
  }, 100);
}

function next(){
  logCurrentCard(Date.now());
  renderCard();   // picker advances to a different source
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ---- scorecard ----
function openStats(){
  const log = loadLog();
  const days = new Set(log.map(s=>s.day)).size;
  const voluntary = Math.round(log.reduce((a,s)=>a+(s.voluntarySec||0),0)/60);
  const worth = log.filter(s=>s.verdict==="worth").length;
  const sessions = log.length;
  const list = document.getElementById("statsList");
  list.innerHTML = `
    <div class="stat-row"><span class="k">days opened (target 7 / 10)</span><span class="v">${days}<small> /10</small></span></div>
    <div class="stat-row"><span class="k">sessions</span><span class="v">${sessions}</span></div>
    <div class="stat-row"><span class="k">voluntary minutes (past the timer)</span><span class="v">${voluntary}<small> min</small></span></div>
    <div class="stat-row"><span class="k">"worth it" sessions</span><span class="v">${worth}</span></div>
  `;
  document.getElementById("statsOverlay").classList.add("show");
}

function exportCSV(){
  const log = loadLog();
  const head = "startISO,day,cards,durationSec,forcedSec,voluntarySec,verdict\n";
  const rows = log.map(s=>[s.startISO,s.day,s.cards,s.durationSec,s.forcedSec,s.voluntarySec,s.verdict].join(",")).join("\n");
  const blob = new Blob([head+rows], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "reading-room-log.csv";
  a.click();
}

// ---- wire up ----
document.getElementById("nextBtn").addEventListener("click", () => { if(!document.getElementById("nextBtn").disabled) next(); });
const verdictOverlay = document.getElementById("verdictOverlay");
function closeVerdictOverlay(){ verdictOverlay.classList.remove("show"); }
document.getElementById("doneBtn").addEventListener("click", () => {
  clearInterval(focusTimer);
  verdictOverlay.classList.add("show");
});
document.getElementById("closeVerdict").addEventListener("click", closeVerdictOverlay);
verdictOverlay.addEventListener("click", e => { if(e.target === verdictOverlay) closeVerdictOverlay(); });
document.querySelectorAll(".verdict").forEach(b => b.addEventListener("click", () => {
  endSession(b.dataset.v);
  closeVerdictOverlay();
  location.reload();
}));
document.getElementById("statsBtn").addEventListener("click", openStats);
const themeBtn = document.getElementById("themeBtn");
(function(){
  const saved = localStorage.getItem("theme");
  if(saved === "light"){ document.body.classList.add("light"); themeBtn.textContent = "dark"; }
})();
themeBtn.addEventListener("click", () => {
  const isLight = document.body.classList.toggle("light");
  themeBtn.textContent = isLight ? "dark" : "light";
  localStorage.setItem("theme", isLight ? "light" : "dark");
});
document.getElementById("closeStats").addEventListener("click", () => document.getElementById("statsOverlay").classList.remove("show"));
document.getElementById("exportBtn").addEventListener("click", exportCSV);
document.getElementById("resetBtn").addEventListener("click", () => {
  if(confirm("Erase all logged sessions? This can't be undone.")){ saveLog([]); openStats(); }
});

// ---- category picker ----
const pickerOverlay = document.getElementById("pickerOverlay");
const catGrid       = document.getElementById("catGrid");
const startBtn      = document.getElementById("startBtn");

function renderPicker(){
  const current = new Set(loadPrefs() || CATEGORIES.map(c=>c.id));
  catGrid.innerHTML = CATEGORIES.map(c => `
    <button class="cat-btn${current.has(c.id) ? " on" : ""}" data-id="${c.id}">
      <span class="cat-label">${c.label}</span>
      <span class="cat-desc">${c.desc}</span>
    </button>
  `).join("");
  catGrid.querySelectorAll(".cat-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      btn.classList.toggle("on");
      startBtn.disabled = catGrid.querySelectorAll(".cat-btn.on").length === 0;
    });
  });
  startBtn.disabled = catGrid.querySelectorAll(".cat-btn.on").length === 0;
}

function openPicker(){
  renderPicker();
  pickerOverlay.classList.add("show");
  pickerOpen = true;
}

function confirmPicker(){
  const selected = [...catGrid.querySelectorAll(".cat-btn.on")].map(b => b.dataset.id);
  if(!selected.length) return;
  savePrefs(selected);
  pickerOpen = false;
  pickerOverlay.classList.remove("show");
  applyPrefs();
  if(!firstRendered && buckets.size > 0){
    firstRendered = true;
    document.getElementById("loading")?.remove();
    renderCard();
  }
}

function dismissPicker(){
  // on first launch with no saved prefs, default to all categories
  if(!loadPrefs()) savePrefs(CATEGORIES.map(c=>c.id));
  pickerOpen = false;
  pickerOverlay.classList.remove("show");
  applyPrefs();
  if(!firstRendered && buckets.size > 0){
    firstRendered = true;
    document.getElementById("loading")?.remove();
    renderCard();
  }
}

startBtn.addEventListener("click", confirmPicker);
document.getElementById("closePicker").addEventListener("click", dismissPicker);
pickerOverlay.addEventListener("click", e => { if(e.target === pickerOverlay) dismissPicker(); });
document.getElementById("prefsBtn").addEventListener("click", openPicker);

// ---- go ----
(function init(){
  startSession();
  loadFeedsProgressive();   // starts fetching immediately in the background
  if(!loadPrefs()){ openPicker(); }  // first launch: show picker on top of loading state
})();
</script>
